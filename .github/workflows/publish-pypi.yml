name: Publish Python packages to PyPI

on:
  push:
    tags:
      - "sdk-python-v*"
      - "sdk-openai-v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - bighub
          - bighub-openai
          - both
        default: both

jobs:
  publish-bighub:
    name: Publish bighub
    if: |
      startsWith(github.ref, 'refs/tags/sdk-python-v') ||
      github.event_name == 'workflow_dispatch' && contains(fromJson('["bighub","both"]'), github.event.inputs.package)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine pytest

      - name: Run SDK tests
        run: python -m pytest -q sdk/python/tests

      - name: Clean dist
        run: |
          rm -rf sdk/python/dist
          mkdir -p sdk/python/dist

      - name: Build SDK package
        run: python -m build sdk/python

      - name: Validate SDK package
        run: python -m twine check sdk/python/dist/*

      - name: Publish SDK package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist

  publish-bighub-openai:
    name: Publish bighub-openai
    if: |
      startsWith(github.ref, 'refs/tags/sdk-openai-v') ||
      github.event_name == 'workflow_dispatch' && contains(fromJson('["bighub-openai","both"]'), github.event.inputs.package)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade build twine pytest

      - name: Install local SDK for adapter tests
        run: python -m pip install ./sdk/python

      - name: Run adapter tests
        run: python -m pytest -q adapters/python/openai/tests

      - name: Clean dist
        run: |
          rm -rf adapters/python/openai/dist
          mkdir -p adapters/python/openai/dist

      - name: Build adapter package
        run: python -m build adapters/python/openai

      - name: Validate adapter package
        run: python -m twine check adapters/python/openai/dist/*

      - name: Publish adapter package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: adapters/python/openai/dist
